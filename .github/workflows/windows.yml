name: Construire NJOKA DAMES pour Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Installer WiX Toolset
        shell: powershell
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset --yes --no-progress
          }

          $candle = Get-ChildItem `
            'C:\Program Files (x86)\WiX Toolset*',
            'C:\Program Files\WiX Toolset*' `
            -Filter candle.exe -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $candle) {
            throw "WiX Toolset est introuvable."
          }

          $candle.DirectoryName | Out-File `
            -FilePath $env:GITHUB_PATH -Append

      - name: Compiler tous les composants
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/classes | Out-Null

          $sources = Get-ChildItem src/com/mbida/njokadames `
            -Recurse -Filter *.java |
            Where-Object {
              $_.FullName -notmatch '[\\/]tests[\\/]'
            } |
            ForEach-Object { $_.FullName }

          if ($sources.Count -eq 0) {
            throw "Aucun fichier Java source trouvé."
          }

          javac -encoding UTF-8 -d build/classes $sources

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Compiler les tests
        shell: pwsh
        run: |
          $tests = Get-ChildItem `
            src/com/mbida/njokadames/tests `
            -Filter *.java |
            ForEach-Object { $_.FullName }

          javac -encoding UTF-8 `
            -cp build/classes `
            -d build/classes `
            $tests

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Exécuter les tests
        shell: pwsh
        run: |
          $testNames = @(
            "EngineTest",
            "AITest",
            "CaptureBlockingTest",
            "PromotionCaptureTest",
            "DifficultyTest"
          )

          foreach ($test in $testNames) {
            Write-Host "===== $test ====="

            java -cp build/classes `
              "com.mbida.njokadames.tests.$test"

            if ($LASTEXITCODE -ne 0) {
              throw "Échec du test : $test"
            }
          }

      - name: Créer le JAR exécutable
        shell: pwsh
        run: |
          jar --create `
            --file build/NJOKA-DAMES-Windows.jar `
            --main-class com.mbida.njokadames.desktop.Main `
            -C build/classes .

          New-Item -ItemType Directory -Force package-input | Out-Null

          Copy-Item `
            build/NJOKA-DAMES-Windows.jar `
            package-input/

      - name: Construire la version portable
        shell: pwsh
        run: |
          jpackage `
            --type app-image `
            --input package-input `
            --dest portable `
            --name NJOKA-DAMES `
            --main-jar NJOKA-DAMES-Windows.jar `
            --main-class com.mbida.njokadames.desktop.Main `
            --app-version 1.0.0 `
            --vendor "Mbida Mbida Camille"

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          Compress-Archive `
            -Path portable/NJOKA-DAMES `
            -DestinationPath NJOKA-DAMES-Portable.zip `
            -Force

      - name: Construire l'installateur EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null

          jpackage `
            --type exe `
            --input package-input `
            --dest dist `
            --name NJOKA-DAMES `
            --main-jar NJOKA-DAMES-Windows.jar `
            --main-class com.mbida.njokadames.desktop.Main `
            --app-version 1.0.0 `
            --vendor "Mbida Mbida Camille" `
            --win-menu `
            --win-menu-group "NJOKA DAMES" `
            --win-shortcut `
            --win-per-user-install

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Publier les fichiers générés
        uses: actions/upload-artifact@v4
        with:
          name: NJOKA-DAMES-Windows-1.0.0
          path: |
            dist/*.exe
            NJOKA-DAMES-Portable.zip
          if-no-files-found: error
          retention-days: 30
